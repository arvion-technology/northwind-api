name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Northwind.sln

      - name: Build
        run: dotnet build Northwind.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Northwind.sln --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Verify demo assets
        run: node scripts/serve-check.mjs
